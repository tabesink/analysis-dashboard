# RSP Dashboard - LAN production stack (plain HTTP, single reverse proxy).
#
# Topology:
#     browser (LAN) -> proxy:8080 (host DASHBOARD_PORT)
#                   -> /api/* and /health* -> server:8000
#                   -> everything else     -> client:3000
#     jwt-init (one-shot) generates JWT_SECRET into a named volume on first up.
#
# Operator workflow on the prod host:
#     1. Place `images.tar` next to this file (produced by `Deployment/build.sh`).
#     2. `cp .env.example .env` and set `ADMIN_SECRET` (required).
#     3. `./deploy.sh`            (Linux)
#        or `.\deploy.ps1`        (Windows / Docker Desktop)
#
# Manual equivalent of step 3:
#     docker load -i images.tar
#     docker compose --env-file .env up -d
#
# This stack is for trusted internal LAN deployments. It serves plain HTTP and
# sets `ALLOW_INSECURE_COOKIES=true` so the server's production-mode validator
# permits non-`Secure` cookies. Do NOT expose this port to the public
# internet without putting an HTTPS-terminating reverse proxy in front.

name: rsp-dashboard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  # ---------------------------------------------------------------------
  # Single LAN entrypoint. Plain HTTP only; keep this behind the trusted LAN.
  # ---------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    user: "101:101"
    ports:
      - "${DASHBOARD_PORT:-3000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    <<: *security-baseline
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,mode=1777,uid=101,gid=101
      - /var/run:size=16M,mode=1777,uid=101,gid=101
    pids_limit: 100
    cpus: 0.5
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    labels:
      service: proxy
      env: production

  # ---------------------------------------------------------------------
  # One-shot init: generate JWT_SECRET on first up. Idempotent across
  # restarts because the secret is persisted in a named volume.
  # ---------------------------------------------------------------------
  jwt-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    volumes:
      - jwt:/secrets
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /secrets/jwt_secret ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/jwt_secret
            chmod 600 /secrets/jwt_secret
            chown 1001:1001 /secrets/jwt_secret
            echo "generated /secrets/jwt_secret"
        else
            echo "/secrets/jwt_secret already present, leaving as-is"
        fi
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    logging: *default-logging

  # ---------------------------------------------------------------------
  # Server (FastAPI + DuckDB)
  # ---------------------------------------------------------------------
  server:
    image: rsp-dashboard-server:${IMAGE_TAG:-1.3.7}
    restart: unless-stopped
    user: "1001:1001"
    volumes:
      - data:/app/data
      - logs:/app/logs
      - jwt:/run/secrets:ro
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATA_ROOT=/app/data
      - LOG_DIR=/app/logs
      - LOG_TO_FILE=true
      - SLOW_QUERY_MS=${SLOW_QUERY_MS:-1000}
      # Matplotlib defaults to /app/.config, which is read-only in this stack.
      - MPLCONFIGDIR=/tmp/matplotlib
      # Large Parquet ZIP upload/validate/import uses data_root/tmp, not the small /tmp tmpfs.
      - TMPDIR=/app/data/tmp
      # LAN opt-in: lets the server skip the AUTH_COOKIE_SECURE / CORS
      # wildcard prod-mode validators. Required because we serve plain HTTP.
      - ALLOW_INSECURE_COOKIES=true
      - AUTH_COOKIE_SECURE=false
      - AUTH_COOKIE_SAMESITE=lax
      - JWT_EXPIRY_HOURS=12
      # Wildcard CORS is acceptable on a trusted LAN once ALLOW_INSECURE_COOKIES
      # is set. Tighten if you know the exact LAN origin.
      - CORS_ORIGINS__0=*
      # Admin user password - REQUIRED. Set in .env.
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set in .env (copy .env.example -> .env and edit)}
    command:
      - sh
      - -c
      - |
        export JWT_SECRET="$$(cat /run/secrets/jwt_secret)"
        exec python -m server
    depends_on:
      jwt-init:
        condition: service_completed_successfully
    <<: *security-baseline
    tmpfs:
      - /tmp:size=128M,mode=1777
    pids_limit: 512
    cpus: 4
    mem_limit: 12g
    mem_reservation: 2g
    healthcheck:
      # Liveness only — readiness probes DuckDB and can block during large imports.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      service: server
      env: production

  # ---------------------------------------------------------------------
  # Client (Next.js standalone)
  # ---------------------------------------------------------------------
  client:
    image: rsp-dashboard-client:${IMAGE_TAG:-1.3.7}
    restart: unless-stopped
    user: "1001:1001"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_MODE=same-origin
      # The release image is built with same-origin API mode so browser calls
      # use `/api/...` through the proxy instead of direct server host ports.
    depends_on:
      server:
        condition: service_healthy
    <<: *security-baseline
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/.next/cache:size=128M,mode=1777
    pids_limit: 200
    cpus: 1
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      service: client
      env: production

volumes:
  data:
  logs:
  jwt:
