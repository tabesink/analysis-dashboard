events {}

http {
    server {
        listen 8080;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://server:8000;
            # Match server max_upload_size_mb (61440) so Parquet ZIP imports are
            # not rejected at the proxy (nginx default is 1m).
            client_max_body_size 60G;
            # Stream large multipart uploads to the API instead of buffering on
            # the proxy's 32 MB /var/cache/nginx tmpfs.
            proxy_request_buffering off;
            # Large DB imports can run up to the client XHR timeout (30 min).
            client_body_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        location /health {
            proxy_pass http://server:8000;
        }

        location / {
            proxy_pass http://client:3000;
        }
    }
}
