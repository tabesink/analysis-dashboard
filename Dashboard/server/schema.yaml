# RSP Data Analytics Dashboard - Database Schema
# Source of truth for dim tables and filter options
# Non-dim tables and index policy are currently managed in server/storage/database.py
# Modify this file for dim schema/filter changes, then run migrations

version: 1

# Sequences for auto-incrementing IDs
sequences:
  - name: seq_audit_log_id
    start: 1
  - name: seq_meas_lttb_id
    start: 1
  - name: seq_saved_filter_id
    start: 1
  - name: seq_event_access_id
    start: 1

# Table definitions
tables:
  dim_program:
    description: Program metadata
    columns:
      - name: program_id
        type: VARCHAR
        primary_key: true
      - name: name
        type: VARCHAR
        nullable: true
      - name: created_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP

  dim_event:
    description: Event metadata with filter columns
    columns:
      # Core columns
      - name: event_id
        type: VARCHAR
        primary_key: true
      - name: program_id
        type: VARCHAR
        nullable: false
      - name: version
        type: VARCHAR
        nullable: false
      
      # Filter columns - each has filter config for UI
      - name: status
        type: VARCHAR
        filter:
          display_name: "Status"
          order: 1
          values:
            - "Approved"
            - "Obsolete"
            - "Pending"
      
      - name: rfq
        type: BOOLEAN
        default: "FALSE"
        filter:
          display_name: "RFQ"
          order: 2
          values:
            - "Applicable"
            - "Not Applicable"
      - name: dv
        type: BOOLEAN
        default: "FALSE"
        filter:
          display_name: "DV"
          order: 3
          values:
            - "Applicable"
            - "Not Applicable"
      - name: pv
        type: BOOLEAN
        default: "FALSE"
        filter:
          display_name: "PV"
          order: 4
          values:
            - "Applicable"
            - "Not Applicable"
      - name: post_prod
        type: BOOLEAN
        default: "FALSE"
        filter:
          display_name: "Post-Prod"
          order: 5
          values:
            - "Applicable"
            - "Not Applicable"

      - name: suspension_component
        type: VARCHAR
        filter:
          display_name: "Suspension Component"
          order: 6
          values:
            - "A-Arm (UCA)"
            - "A-Arm (LCA)"
            - "L-Arm"
            - "H-Arm"
            - "Trailing Arm"
            - "Tension Link"
            - "Lateral Link"
            - "Upper Trailing Link"
            - "Lower Trailing Link"
            - "Camber Link"
            - "Spring Link"
            - "Toe Link"
      
      - name: axle_location
        type: VARCHAR
        filter:
          display_name: "Axle Location"
          order: 7
          values:
            - "Front"
            - "Rear"

      - name: gvw
        type: VARCHAR
      
      - name: gross_vehicle_weight_range_lbs
        type: VARCHAR
        filter:
          display_name: "Gross Vehicle Weight Range (lbs)"
          order: 8
          values:
            - "1000-1500"
            - "1500-2000"
            - "2000-2500"
            - "2500-3000"
            - "3000-3500"
            - "3500-4000"
            - "4000-4500"
            - "4500-5000"
            - "5000-5500"
            - "5500-6000"
            - "6000-6500"
            - "6500-7000"
            - "7000-7500"
            - "7500-8000"
            - "8000-8500"
            - "8500-9000"
            - "9000-9500"
            - "9500-10000"

      - name: fgawr
        type: VARCHAR
      - name: fgawr_range_lbs
        type: VARCHAR
        filter:
          display_name: "FGAWR Range (lbs)"
          order: 9
          values:
            - "1000-1500"
            - "1500-2000"
            - "2000-2500"
            - "2500-3000"
            - "3000-3500"
            - "3500-4000"
            - "4000-4500"
            - "4500-5000"
            - "5000-5500"
            - "5500-6000"
            - "6000-6500"
            - "6500-7000"
            - "7000-7500"
            - "7500-8000"
            - "8000-8500"
            - "8500-9000"
            - "9000-9500"
            - "9500-10000"

      - name: rgawr
        type: VARCHAR
      - name: rgawr_range_lbs
        type: VARCHAR
        filter:
          display_name: "RGAWR Range (lbs)"
          order: 10
          values:
            - "1000-1500"
            - "1500-2000"
            - "2000-2500"
            - "2500-3000"
            - "3000-3500"
            - "3500-4000"
            - "4000-4500"
            - "4500-5000"
            - "5000-5500"
            - "5500-6000"
            - "6000-6500"
            - "6500-7000"
            - "7000-7500"
            - "7500-8000"
            - "8000-8500"
            - "8500-9000"
            - "9000-9500"
            - "9500-10000"
      
      - name: drive_type
        type: VARCHAR
        filter:
          display_name: "Drive Type"
          order: 11
          values:
            - "ICE"
            - "BEV"
            - "PHEV"

      - name: material_construction
        type: VARCHAR
        filter:
          display_name: "Mat'l & Const"
          order: 12
          values:
            - "Steel (stamped & welded)"
            - "Steel (forged)"
            - "Steel (stamped)"
            - "Ductile Iron (cast)"
            - "Aluminum (forged)"
            - "Aluminum (cast)"
      
      - name: job_number
        type: VARCHAR
      - name: work_order
        type: VARCHAR
      
      - name: steering_position
        type: VARCHAR
        filter:
          display_name: "Steering"
          order: 13
          values:
            - "RHS"
            - "LHS"

      - name: damper_type
        type: VARCHAR
        filter:
          display_name: "Damper Type"
          order: 14
          values:
            - "Coil Over"
            - "Air Suspension"
      
      - name: vehicle_type
        type: VARCHAR
        filter:
          display_name: "Vehicle Type"
          order: 15
          values:
            - "Sedan"
            - "Truck"
            - "Van"
            - "SUV"
            - "Heavy Duty"
            - "Off-Road"
            - "Other"
      
      # System/metadata columns
      - name: source_file
        type: VARCHAR
      - name: file_hash
        type: VARCHAR(16)
      - name: row_count
        type: INTEGER
      - name: uploaded_by_user_id
        type: VARCHAR
      - name: last_updated_by_user_id
        type: VARCHAR
      - name: is_deleted
        type: BOOLEAN
        default: "FALSE"
      - name: created_at
        type: TIMESTAMP
        default: CURRENT_TIMESTAMP
      - name: updated_at
        type: TIMESTAMP

